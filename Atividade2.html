<!DOCTYPE html>
<html lang="pt-BR">
<head>

    <title>Quadro2</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

<table>

    <!-- Primeira linha -->
    <tr>

    </tr>

    <!-- Quarta linha -->

        <td>XXXX</td>

    </tr>

        <td>XXXX</td>
        <td>XXXX</td>

    <!-- Sexta linha -->
    <tr>
        <th colspan="3">XXXX</th>

    </tr>

    <!-- Sétima linha -->
    <tr>
        <td rowspan="4">XXXX</td>
        <th colspan="2">XXXX</th>

        <td rowspan="4">XXXX</td>

    <!-- Oitava linha -->
    <tr>
        <td>XXXX</td>

    </tr>

    <!-- Nona linha -->
    <tr>
        <td>XXXX</td>

    </tr>

    <!-- Décima linha -->
    <tr>
        <td>XXXX</td>

        <td>XXXX</td>
    </tr>

</table>

</html>
